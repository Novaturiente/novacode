# Tag vX.Y.Z → budgets checked (scripts/bench.sh) alongside static builds
# per target, checksums, a GitHub release. Binaries are built with
# NOVACODE_INSTALL=release so `novacode update` may replace them
# (L11.1, L11.7, L11.12).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p novacode
      - run: scripts/bench.sh
  # Runs alongside bench; publish waits for both, so an over-budget build
  # is still never released.
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-apple-darwin, os: macos-14, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false }
    runs-on: ${{ matrix.os }}
    env:
      NOVACODE_INSTALL: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - if: matrix.cross
        # cross runs the build in a container; pass the install kind through.
        run: CROSS_CONTAINER_OPTS="-e NOVACODE_INSTALL=release" cross build --release --locked -p novacode --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked -p novacode --target ${{ matrix.target }}
      - name: package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          a="novacode-$v-${{ matrix.target }}.tar.gz"
          tar -czf "$a" -C "target/${{ matrix.target }}/release" novacode
          (command -v sha256sum >/dev/null && sha256sum "$a" || shasum -a 256 "$a") > "$a.sha256"
      # L11.14: a .zip with novacode.exe; the .sha256 line has the same format as sha256sum's.
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          $a = "novacode-$v-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/novacode.exe" -DestinationPath $a
          $h = (Get-FileHash -Algorithm SHA256 $a).Hash.ToLower()
          Set-Content -NoNewline -Path "$a.sha256" -Value "$h  $a`n"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            novacode-*.tar.gz*
            novacode-*.zip*
  publish:
    needs: [bench, build]
    runs-on: ubuntu-latest
    steps:
      # Only for CHANGELOG.md; kept apart so it can't mix with the artifacts.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: src
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        # The release body is this version's CHANGELOG.md section (link lines dropped),
        # then GitHub's generated notes (the compare link); generated notes alone without one.
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?( |$)" {f=1; next} f && /^## / {exit} f && !/^\[[^]]*\]: /' src/CHANGELOG.md > notes.md
          notes=()
          if grep -q '[^[:space:]]' notes.md; then notes=(--notes-file notes.md); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${notes[@]}" --generate-notes novacode-*
