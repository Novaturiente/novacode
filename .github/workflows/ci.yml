# The same check as scripts/check.sh, plus the oldest supported Rust and a build
# without optional features (L11.7).
name: ci
on:
  push:
    branches: [master, main, windows-port]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p novacode
  no-default-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p novacode --no-default-features
  # The release builds macOS too; catch Linux-only code before a tag does.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p novacode
  # L11.14 Windows port.
  windows:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      # Also after a clippy failure: one run shows both.
      - if: success() || failure()
        run: cargo test --workspace --locked --no-fail-fast
      # The binary starts and finds Git Bash on a stock runner.
      - if: success() || failure()
        run: |
          cargo run -q --locked -p novacode -- --version
          cargo run -q --locked -p novacode -- doctor
  # L11.12 budgets on every change, warning only: shared runners are noisy, so an
  # OVER row is printed but doesn't fail the job. The release workflow still enforces it.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p novacode
      - run: BENCH_WARN_ONLY=1 scripts/bench.sh
