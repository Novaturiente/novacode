[package]
name = "novacode-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["highlight", "images"]
# Syntax highlighting in code blocks (syntect, ~2MB of grammars).
highlight = ["dep:syntect"]
# Images in the transcript: Kitty, iTerm2, Sixel, or half-blocks (L9.14).
images = ["dep:ratatui-image", "dep:image"]

[dependencies]
novacode-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
unicode-segmentation = "1"
base64 = "0.22"
ignore = "0.4"
nix = { version = "0.30", features = ["signal", "poll"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"], optional = true }
