[package]
name = "novacode-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
novacode-types.workspace = true
novacode-base.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tracing.workspace = true
schemars = { version = "1", features = ["preserve_order"] }
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
globset = "0.4"
regex = "1"
nix = { version = "0.30", features = ["signal"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"], optional = true }

[features]
default = ["images"]
# Convert and shrink images (L2.22). Off: only images that already fit are sent.
images = ["dep:image"]

[dev-dependencies]
tempfile.workspace = true
