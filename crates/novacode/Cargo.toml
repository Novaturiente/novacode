[package]
name = "novacode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["images", "highlight"]
# Images: shrinking before sending (tools) and showing them in the terminal (tui).
images = ["novacode-tools/images", "novacode-tui/images"]
# Syntax highlighting in code blocks.
highlight = ["novacode-tui/highlight"]
# Super mode (L10.9): not ready for production, so off in release builds.
super = []

[dependencies]
novacode-base.workspace = true
novacode-core.workspace = true
novacode-tui.workspace = true
novacode-tools.workspace = true
anyhow.workspace = true
regex = "1"
tracing.workspace = true
novacode-ai.workspace = true
novacode-types.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
reqwest.workspace = true
sha2 = "0.10"
clap.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
tokio-util.workspace = true
# L8.12: ACP v1 types only; the JSON-RPC loop is ours (acp.rs).
agent-client-protocol-schema = { version = "1.16", default-features = false }
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true

# L11.14: `novacode update` replaces the running .exe, which Windows won't rename over.
[target.'cfg(windows)'.dependencies]
self-replace = "1"

