[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.4"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
novacode-base = { path = "crates/novacode-base" }
novacode-types = { path = "crates/novacode-types" }
novacode-ai = { path = "crates/novacode-ai" }
# Feature gates (L11.7) are chosen by the binary: see crates/novacode/Cargo.toml.
novacode-tools = { path = "crates/novacode-tools", default-features = false }
novacode-script = { path = "crates/novacode-script" }
novacode-core = { path = "crates/novacode-core" }
novacode-tui = { path = "crates/novacode-tui", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "process", "fs"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
