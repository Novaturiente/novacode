[package]
name = "novacode-lsp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
description = "novacode process extension: language-server diagnostics after edits"

# Not part of novacode's workspace or distribution: built and installed on its own.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "process", "fs"] }

[dev-dependencies]
tempfile = "3"
